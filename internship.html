<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Internships | Abdul Rahman</title>
<link rel="icon" type="image/png" href="image/logo.png">
<link rel="shortcut icon" type="image/png" href="image/logo.png">
<link rel="apple-touch-icon" href="image/logo.png">

<style>

@font-face {
  font-family: 'Gambarino';
  src: url('assets/fonts/Gambarino-Regular.woff2') format('woff2'),
       url('https://cdn.fontshare.com/wf/ZINX7PW4XMYISLZAZKYY4QHYYHYNPKAV/Z54IGKTR4PBLA5KTYL3IDQZHFQPJJVNZ/6KBHT5NXCZVM6GHTPKGIR6DXZLQAYIFK.woff2') format('woff2');
  font-weight: 400 700;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Libertinus Math';
  src: url('assets/fonts/LibertinusMath-Regular.otf') format('opentype'),
       url('../assets/fonts/LibertinusMath-Regular.otf') format('opentype'),
       url('https://fontlibrary.org/assets/fonts/libertinus-math/669b2b03ec50a970ff13c8f3009bd78c/c567424c45cb2196bbf6697da4bab4b9/LibertinusMathRegular.otf') format('opentype');
  font-weight: 400 700;
  font-style: normal;
  font-display: swap;
}

:root{
    --font-heading:'Gambarino', Georgia, serif;
    --font-body:'Libertinus Math', 'LibertinusMathRegular', Georgia, serif;

    --bg-primary:#0f0f1a;
    --bg-secondary:#1a1a2e;
    --bg-card:#16213e;

    --text-primary:#ffffff;
    --text-secondary:#b8b8d1;

    --accent-primary:#7c3aed;
    --accent-secondary:#a855f7;
    --accent-gradient:linear-gradient(135deg,#7c3aed 0%,#ec4899 100%);

    --border-color:#2d2d44;

    --shadow:0 8px 32px rgba(124,58,237,.15);

    --radius:18px;

    --font-main:var(--font-heading);
    --font-mono:var(--font-body);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
}

body{
    background:var(--bg-primary);
    color:var(--text-primary);
    font-family:var(--font-body);
    min-height:100vh;
}

.subtle-particle-canvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:0;
    pointer-events:none;
    opacity:0.85;
}

main{
    width:min(1150px,94%);
    max-width:100%;
    margin:32px auto 60px;
    padding:0 16px;
    position:relative;
    z-index:2;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:10px 20px;

    border-radius:12px;

    text-decoration:none;

    color:var(--text-primary);

    border:1px solid var(--border-color);

    background:rgba(124,58,237,.08);

    transition:.3s;
    margin-bottom:16px;
}

.back-btn:hover{
    background:var(--accent-gradient);
    transform:translateY(-3px);
    box-shadow:var(--shadow);
}

.page-title{
    text-align:center;
    margin:10px 0 24px;
}

.page-title h1{
    font-size:clamp(2.4rem,6vw,4.2rem);
    font-weight:800;
    margin-bottom:8px;
}

.page-title p{
    color:var(--text-secondary);
    font-size:1.05rem;
}

.divider{
    width:120px;
    height:4px;
    margin:16px auto 0;
    border-radius:20px;
    background:var(--accent-gradient);
}

.table-wrap{
    margin-top:24px;

    background:var(--bg-secondary);

    border:1px solid var(--border-color);

    border-radius:20px;

    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    width:100%;
    max-width:100%;

    box-shadow:var(--shadow);
}

table{
    width:100%;
    min-width:650px;
    border-collapse:collapse;
}

thead{
    background:rgba(124,58,237,.08);
}

th{
    padding:16px 20px;

    text-align:left;

    color:var(--accent-secondary);

    text-transform:uppercase;

    letter-spacing:1.5px;

    font-size:.78rem;

    font-family:var(--font-mono);

    border-bottom:1px solid var(--border-color);
}

td{
    padding:16px 20px;

    color:var(--text-primary);

    border-bottom:1px solid var(--border-color);
}

tbody tr{
    transition:.3s ease;
}

tbody tr:hover{
    background:rgba(124,58,237,.08);
}

tbody tr:last-child td{
    border-bottom:none;
}

.role{
    display:inline-block;

    padding:6px 14px;

    border-radius:999px;

    font-size:.75rem;

    font-family:var(--font-mono);

    letter-spacing:1px;

    color:#fff;

    background:var(--accent-gradient);

    box-shadow:0 0 18px rgba(124,58,237,.25);
}

::-webkit-scrollbar{
    height:8px;
}

::-webkit-scrollbar-thumb{
    background:var(--accent-primary);
    border-radius:20px;
}

::-webkit-scrollbar-track{
    background:var(--bg-secondary);
}

@media(max-width:768px){

main{
    width:96%;
    margin:16px auto 40px;
    padding:0 8px;
}

.page-title{
    margin:8px 0 20px;
}

.page-title h1{
    font-size:2.2rem;
}

.page-title p{
    font-size:.95rem;
}

th,
td{
    padding:12px 14px;
}

.back-btn{
    padding:8px 16px;
    font-size:.9rem;
    margin-bottom:12px;
}

table{
    min-width:580px;
}

}

</style>

</head>

<body>

<main>

<a href="index.html" class="back-btn">
← Back
</a>

<div class="page-title">
<h1>Internships</h1>
<p>Where I've interned and what I worked on.</p>
<div class="divider"></div>
</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Year</th>
<th>Company Name</th>
<th>Role</th>
<th>Duration</th>
</tr>
</thead>

<tbody id="internship-tbody">

<tr>
<td colspan="4" style="text-align:center;color:var(--text-secondary);">
Loading internships...
</td>
</tr>

</tbody>

</table>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="internship.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="cinematic-reveal.js"></script>

</body>
</html>
